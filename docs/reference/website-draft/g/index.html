<!doctype html>
<html lang="it">
<head>
  <meta name="apple-itunes-app" content="app-id=6822809444">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ManaPal · Partita condivisa</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: -apple-system, system-ui, sans-serif;
         background: radial-gradient(circle at top, #3a2c12 0%, #0d0c12 60%); color: #f4efe3; text-align: center; }
  main { padding: 32px 28px; max-width: 420px; }
  h1 { font-family: ui-serif, Georgia, serif; font-size: 32px; margin: 18px 0 8px; }
  p { color: #b9b2a3; line-height: 1.45; }
  .mark { font-size: 64px; }
  a.button { display: block; margin: 14px 0; padding: 16px; border-radius: 999px; font-weight: 700; text-decoration: none; }
  .primary { background: linear-gradient(135deg, #ffe08a, #e0a43a); color: #15120c; }
  .secondary { border: 1px solid #e0a43a66; color: #f4efe3; }
</style>
</head>
<body>
<main>
  <div class="mark">✦</div>
  <h1>Una partita ti aspetta</h1>
  <p>Un amico ha condiviso una partita di Magic con te. Installa ManaPal e inquadra di nuovo il QR: la partita finirà nelle tue statistiche.</p>
  <a class="button primary" id="store" href="https://apps.apple.com/app/idAPP_STORE_ID">Scarica ManaPal</a>
  <a class="button secondary" id="open" href="#">Ho già ManaPal: apri la partita</a>
</main>
<script>
  var data = location.hash.replace(/^#/, "");
  document.getElementById("open").href = "manapal://game?" + data;
</script>
</body>
</html>
